name: Workflow A — New Opportunity

on:
  schedule:
    # Theme Discovery cadence: pre-market, Mon/Wed/Fri. The policy's own
    # review cadence is ~1-3 new decks a week (Section 9), so scanning more
    # often than that just re-pays for research that (per theme_discovery's
    # own screened-out memory, see src/agents/theme_discovery.py) usually
    # reaches the same conclusion it reached a day or two before. Time is
    # UTC and approximates Eastern Time without adjusting for DST — expect
    # ~1hr drift for half the year.
    - cron: "0 12 * * 1,3,5"   # ~8:00am ET, Mon/Wed/Fri — pre-market
    # Cheap, no-LLM housekeeping: read GitHub Issue comments for decisions
    # and fill confirmations, and apply the 5-business-day no-response default.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a specific stage manually"
        type: choice
        options: [discover, responses, fills, expire, all]
        default: all

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Verification/Synthesis now need up to 16000 output tokens each (deeper
    # valuation re-derivation/rendering) — 35 min was observed too tight and
    # the job was killed mid-run with no debug issue posted (see fix below).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Discover + run pipeline on new candidates
        id: discover
        if: >
          github.event.schedule == '0 12 * * 1,3,5' ||
          github.event.inputs.mode == 'discover' ||
          github.event.inputs.mode == 'all'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python -m src.workflow_a discover --source "${{ github.event.schedule || 'manual' }}" \
            2>&1 | tee /tmp/discover.log

      - name: Post debug issue if discover failed or timed out
        # A job-level timeout cancels the step (outcome 'cancelled'), not
        # 'failure' — without this, a timeout previously left us with zero
        # visibility since the log never got posted anywhere readable.
        if: always() && (steps.discover.outcome == 'failure' || steps.discover.outcome == 'cancelled')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/post_debug_issue.py "[Debug] workflow_a discover failed or timed out" /tmp/discover.log

      - name: Post run summary (manual triggers only)
        if: github.event_name == 'workflow_dispatch' && steps.discover.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/post_debug_issue.py "[Run summary] workflow_a discover (manual)" /tmp/discover.log

      - name: Fail job if discover failed
        if: steps.discover.outcome == 'failure'
        run: exit 1

      - name: Process responses + fills + expiry
        id: process
        if: >
          github.event.schedule == '0 */4 * * *' ||
          github.event.inputs.mode == 'responses' ||
          github.event.inputs.mode == 'fills' ||
          github.event.inputs.mode == 'expire' ||
          github.event.inputs.mode == 'all'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            python -m src.workflow_a responses
            python -m src.workflow_a fills
            python -m src.workflow_a expire
          } 2>&1 | tee /tmp/process.log

      - name: Post debug issue if process failed or timed out
        if: always() && (steps.process.outcome == 'failure' || steps.process.outcome == 'cancelled')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/post_debug_issue.py "[Debug] workflow_a process failed or timed out" /tmp/process.log

      - name: Fail job if process failed
        if: steps.process.outcome == 'failure'
        run: exit 1
