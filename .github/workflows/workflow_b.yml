name: Workflow B — Standing Position Monitoring

on:
  schedule:
    # Base cadence (Section 7, Workflow B): monthly. Use workflow_dispatch
    # below for an "event-triggered" run (e.g. you noticed a big move or
    # relevant news and want an off-cycle re-score before the next month).
    - cron: "0 13 1 * *"   # ~9:00am ET, 1st of each month
    # Cheap, no-LLM housekeeping: read comments on monitoring decks.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a specific stage manually (event-triggered monitoring)"
        type: choice
        options: [monitor, responses]
        default: monitor

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run monitoring pass
        id: monitor
        if: github.event.schedule == '0 13 1 * *' || github.event.inputs.mode == 'monitor'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python -m src.workflow_b monitor 2>&1 | tee /tmp/monitor.log

      - name: Post debug issue if monitor failed or timed out
        if: always() && (steps.monitor.outcome == 'failure' || steps.monitor.outcome == 'cancelled')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/post_debug_issue.py "[Debug] workflow_b monitor failed or timed out" /tmp/monitor.log

      - name: Post run summary (manual triggers only)
        if: github.event_name == 'workflow_dispatch' && steps.monitor.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/post_debug_issue.py "[Run summary] workflow_b monitor (manual)" /tmp/monitor.log

      - name: Fail job if monitor failed
        if: steps.monitor.outcome == 'failure'
        run: exit 1

      - name: Process monitoring deck responses
        id: responses
        if: github.event.schedule == '0 */4 * * *' || github.event.inputs.mode == 'responses'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python -m src.workflow_b responses 2>&1 | tee /tmp/responses.log

      - name: Post debug issue if responses failed or timed out
        if: always() && (steps.responses.outcome == 'failure' || steps.responses.outcome == 'cancelled')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/post_debug_issue.py "[Debug] workflow_b responses failed or timed out" /tmp/responses.log

      - name: Fail job if responses failed
        if: steps.responses.outcome == 'failure'
        run: exit 1
